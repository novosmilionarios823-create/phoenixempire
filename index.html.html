<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phoenix Empire</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{--bk:#080808;--bk2:#151515;--w:#fff;--g1:#F2F2F2;--g2:#A1A1A1;--line:rgba(255,255,255,.09);--r:14px;
--serif:'Cormorant Garamond',Georgia,serif;--sans:'Manrope',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bk);color:var(--g1);font:400 14px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--w);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3{font-family:var(--serif);font-weight:600;color:var(--w);letter-spacing:.01em;line-height:1.1}
h1{font-size:clamp(30px,4vw,42px)} h2{font-size:24px} h3{font-size:19px}
.muted{color:var(--g2)} .sm{font-size:12.5px}

/* buttons / fields */
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:10px;padding:10px 18px;font-weight:600;border:1px solid var(--line);background:transparent;transition:.2s}
.btn:hover{border-color:var(--g2)}
.btn.pri{background:var(--w);color:var(--bk);border-color:var(--w)} .btn.pri:hover{background:var(--g1)}
.btn.ico{padding:9px;border-radius:50%}
.field{display:grid;gap:6px;margin-bottom:16px}
.field label{color:var(--g2);font-size:12.5px}
.input{width:100%;background:var(--bk);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.input:focus{border-color:var(--g2);outline:none}
.input:disabled{opacity:.55;cursor:not-allowed}

/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1.15fr 1fr}
.login-art{padding:56px;display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(120% 90% at 0% 0%,#1d1d1d 0,var(--bk) 60%);border-right:1px solid var(--line)}
.login-art h1{font-size:clamp(30px,3.4vw,46px);max-width:22ch;font-weight:500;margin-bottom:10px}
.hero-logo{width:min(300px,34vh);margin:auto;display:block;filter:drop-shadow(0 0 44px rgba(240,180,40,.2))}
.mb{display:none;margin-bottom:28px}
.login-form{display:grid;place-items:center;padding:32px}
.login-form form{width:min(380px,100%)}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--serif);font-size:17px;color:var(--w);letter-spacing:.16em;white-space:nowrap}
.mark{width:30px;height:auto;display:block}
.notice{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;color:var(--g2);font-size:12.5px;margin-top:18px}

/* shell */
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:24px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:28px;background:var(--bk)}
.nav{display:grid;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;color:var(--g2);transition:.2s}
.nav a:hover{color:var(--w);background:var(--bk2)}
.nav a.on{background:var(--w);color:var(--bk);font-weight:600}
.side-foot{margin-top:auto}
.main{min-width:0}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:14px 32px;background:rgba(8,8,8,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.search{flex:1;max-width:420px;position:relative}
.search .input{padding-left:40px;background:var(--bk2)}
.search svg{position:absolute;left:13px;top:50%;translate:0 -50%;color:var(--g2)}
.sp{flex:1}
.menu-btn{display:none}
.page{padding:32px;max-width:1280px;margin:auto;display:grid;gap:28px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.page-head p{color:var(--g2);margin-top:6px}

/* dropdowns */
.pop{position:relative}
.drop{position:absolute;right:0;top:calc(100% + 10px);width:340px;max-width:88vw;background:var(--bk2);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 24px 60px rgba(0,0,0,.6);display:none;overflow:hidden}
.drop.open{display:block}
.drop-h{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:600;color:var(--w)}
.drop .row{padding:12px 16px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--w);position:absolute;top:6px;right:6px}

/* components */
.card{background:var(--bk2);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px}
.grid{display:grid;gap:20px}
.grid>*,.page>*{min-width:0}
.g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:1.6fr 1fr}
.stat b{display:block;font:600 34px/1.1 var(--serif);color:var(--w);margin:6px 0 2px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--g1);color:var(--bk);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.avatar.dk{background:var(--bk);color:var(--w);border:1px solid var(--g2)}
.avatar.lg{width:64px;height:64px;font-size:20px}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:600;border:1px solid var(--line);color:var(--g2)}
.badge.w{background:var(--w);color:var(--bk);border-color:var(--w)}
.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row b{color:var(--w);font-weight:600}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:5px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;background:var(--w);border-radius:9px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 15px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--g2)}
.chip.on{background:var(--w);color:var(--bk);border-color:var(--w);font-weight:600}
.cover{aspect-ratio:16/9;border-radius:10px;margin-bottom:16px;display:flex;align-items:flex-end;padding:14px;background:linear-gradient(135deg,#262626,#0e0e0e);border:1px solid var(--line);font:500 26px var(--serif);color:var(--w)}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center;background:linear-gradient(120deg,#1c1c1c,var(--bk2));}
.table{width:100%;border-collapse:collapse}
.table th{text-align:left;color:var(--g2);font-weight:500;font-size:12.5px;padding:10px 12px;border-bottom:1px solid var(--line)}
.table td{padding:13px 12px;border-bottom:1px solid var(--line)}
.tw{overflow-x:auto}
.toggle{width:38px;height:22px;border-radius:99px;background:rgba(255,255,255,.14);position:relative;border:0;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--g2);transition:.2s}
.toggle.on{background:var(--w)} .toggle.on::after{left:19px;background:var(--bk)}

/* chat */
.chat{display:grid;grid-template-columns:320px 1fr;height:calc(100vh - 190px);min-height:480px;padding:0;overflow:hidden}
.chat-l{border-right:1px solid var(--line);overflow:auto}
.chat-l .row{padding:14px 18px;cursor:pointer}
.chat-l .row.on{background:#1e1e1e}
.chat-r{display:flex;flex-direction:column;min-width:0}
.thread{flex:1;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:min(520px,82%);padding:11px 15px;border-radius:14px;background:#222}
.msg.me{align-self:flex-end;background:var(--w);color:var(--bk)}
.composer{display:flex;gap:10px;padding:14px;border-top:1px solid var(--line)}

#toast{position:fixed;left:50%;bottom:24px;translate:-50% 20px;opacity:0;pointer-events:none;background:var(--w);color:var(--bk);padding:11px 18px;border-radius:10px;font-weight:600;transition:.25s;z-index:99;max-width:90vw}
#toast.show{opacity:1;translate:-50% 0}
[hidden]{display:none!important}
.input{color-scheme:dark}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}.cal small{color:var(--g2);padding-bottom:6px}
.day{position:relative;aspect-ratio:1;border-radius:10px;border:1px solid transparent;background:transparent}
.day:hover{border-color:var(--line);background:#1d1d1d}.day.today{border-color:var(--g2)}.day.on{background:var(--w);color:var(--bk);font-weight:700}
.day i{position:absolute;bottom:6px;left:50%;translate:-50% 0;width:5px;height:5px;border-radius:50%;background:currentColor}
.when{width:64px;flex:none}.when b{display:block}
.modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:16px;overflow:auto}
.mbox{width:min(520px,100%);max-height:100%;overflow:auto}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chip.pick{cursor:pointer}.chip.pick:has(input:checked){background:var(--w);color:var(--bk);font-weight:600;border-color:var(--w)}
.chip.pick:has(input:focus-visible){outline:2px solid var(--w);outline-offset:2px}
.sr{position:absolute;opacity:0;pointer-events:none}
.drop.up{top:auto;bottom:calc(100% + 10px);left:0;right:auto}
.drop .mi{display:flex;gap:12px;align-items:center;width:100%;padding:12px 16px;background:none;border:0;text-align:left}.drop .mi:hover{background:#1e1e1e}
.msg.media{display:grid;gap:6px;padding:8px;max-width:min(360px,82%)}
.msg.media img,.msg.media video{width:100%;max-height:320px;object-fit:cover;border-radius:10px;display:block;background:#000}
.msg.media audio{width:100%;max-width:300px}
.bio{display:grid;grid-template-columns:200px 1fr;gap:32px;align-items:center;background:linear-gradient(120deg,#1c1c1c,var(--bk2))}
.bio-logo{width:100%;filter:drop-shadow(0 0 40px rgba(240,180,40,.18))}
.bio-t{max-width:70ch}.bio-t p{margin-top:12px;color:var(--g2)}.bio-t h2{margin-bottom:14px}
.bio-t .lead{font:500 24px/1.25 var(--serif);color:var(--w)}
.g2b{grid-template-columns:repeat(2,1fr)}
.nav a .badge{margin-left:auto;font-size:10.5px;padding:2px 8px}.nav a.on .badge{border-color:rgba(8,8,8,.35);color:var(--bk)}
.soon-card{display:grid;gap:12px;justify-items:start;padding:40px}
.book{display:grid;grid-template-columns:150px 1fr;gap:20px}
.bcover{aspect-ratio:2/3;border:1px solid var(--line);border-radius:6px;background:linear-gradient(160deg,#262626,#0e0e0e);display:flex;flex-direction:column;justify-content:space-between;padding:14px;font:500 19px/1.15 var(--serif);color:var(--w)}
.bcover small{font:500 11px var(--sans);color:var(--g2)}
@media(max-width:1080px){.g2b{grid-template-columns:1fr}}
@media(max-width:560px){.book{grid-template-columns:110px 1fr}.soon-card{padding:28px}}
.rsel{display:none}
@media(max-width:900px){.rsel{display:block;max-width:220px}#rname{display:none}}
.reader{position:fixed;inset:0;z-index:95;background:var(--bk);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);outline:none}
.rbody{flex:1;overflow:auto;padding:16px;text-align:center;background:#0d0d0d}
.rbody canvas{display:block;margin:0 auto;border-radius:4px;box-shadow:0 10px 40px rgba(0,0,0,.6);background:#fff}
.call-bar{flex-wrap:wrap;align-items:center}
.reader .call-top{flex-wrap:nowrap}.reader .call-top .sp{display:none}.reader .call-top b{flex:1;min-width:0}
@media(max-width:560px){#rbm{display:none}}
.call{position:fixed;inset:0;z-index:90;background:var(--bk);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.call-top{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tiles{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));grid-auto-rows:min-content;gap:14px;padding:16px;overflow:auto;align-content:start;align-content:safe center}
.tile{aspect-ratio:16/10;min-height:120px;background:var(--bk2);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden}
.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.tile.me b{position:absolute;left:12px;bottom:10px;background:rgba(0,0,0,.6);padding:2px 10px;border-radius:99px}
.call-bar{display:flex;gap:12px;justify-content:center;padding:18px;border-top:1px solid var(--line)}
.call-bar .btn.off{background:var(--w);color:var(--bk)}
@media(max-width:700px){.bio{grid-template-columns:1fr}.bio-logo{width:120px;margin:auto}}
.rec{flex:1;display:flex;align-items:center;gap:12px}.rec .g{flex:1}
.rec-dot{width:10px;height:10px;border-radius:50%;background:var(--w);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.msg.audio{display:flex;align-items:center;gap:10px;padding:8px 12px}.msg.audio audio{height:36px;max-width:240px}
@media(prefers-reduced-motion:reduce){.rec-dot{animation:none}}
.scrim{display:none}

@media(max-width:1080px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}.g2,.hero{grid-template-columns:1fr}}
@media(max-width:900px){
 .login{grid-template-columns:1fr}.login-art{display:none}.mb{display:block}
 .app{grid-template-columns:1fr}
 .side{position:fixed;z-index:40;width:280px;translate:-100%;transition:.25s}
 .app.nav-open .side{translate:0}
 .app.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30}
 .menu-btn{display:inline-flex}
 .top{padding:12px 16px}.page{padding:20px 16px}
 .top .search{display:none}
 .chat{grid-template-columns:1fr}.chat-l{display:none}
}
@media(max-width:560px){.g4,.g3{grid-template-columns:1fr}.page-head .btn{width:100%;justify-content:center}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
</style>
</head>

const pad = n => String(n).padStart(2, '0'), ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());

function meetBody() {
  const start = (new Date(MV.y, MV.m, 1).getDay() + 6) % 7, days = new Date(MV.y, MV.m + 1, 0).getDate(), today = ymd(new Date());
  let cells = '<span></span>'.repeat(start);
  for (let d = 1; d <= days; d++) {
    const k = MV.y + '-' + pad(MV.m + 1) + '-' + pad(d), n = MEET.filter(x => x.d === k).length;
    cells += `<button class="day ${k === today ? 'today' : ''} ${k === MV.sel ? 'on' : ''}" data-day="${k}" aria-label="${d} de ${MONTHS[MV.m]}${n ? ', ' + n + ' reunião(ões)' : ''}">${d}${n ? '<i></i>' : ''}</button>`;
  }
  const list = MEET.filter(x => !MV.sel || x.d === MV.sel).sort((a, b) => (a.d + a.h).localeCompare(b.d + b.h));
  const nav = `<div class="chips"><button class="btn ico" data-mv="-1" aria-label="Mês anterior">‹</button><button class="btn ico" data-mv="1" aria-label="Mês seguinte">›</button></div>`;
  const items = list.length ? list.map(m => `<div class="row"><div class="when"><b>${m.h}</b><span class="muted sm">${fmtD(m.d)}</span></div><div class="grow"><b class="ell" style="display:block">${esc(m.t)}</b><span class="muted sm ell" style="display:block">${m.fmt}, ${esc(m.loc)}, ${m.dur} min</span><span class="muted sm ell" style="display:block">${m.who.length ? 'Com ' + m.who.join(', ') : 'Sem participantes'}</span></div><button class="btn ico" data-del="${m.id}" aria-label="Cancelar reunião">${icon('trash')}</button></div>`).join('') : '<p class="muted">Sem reuniões neste dia.</p>';
  return `<div class="grid g2">${Card(MONTHS[MV.m] + ' ' + MV.y, `<div class="cal">${['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'].map(x => `<small>${x}</small>`).join('')}${cells}</div>`, nav)}${Card(MV.sel ? 'Reuniões de ' + fmtD(MV.sel) : 'Próximas reuniões', items, MV.sel ? '<button class="btn" data-day="">Ver todas</button>' : '')}</div>`;
}

function openMeet() {
  const d = document.createElement('div'); d.className = 'modal';
  d.innerHTML = `<form class="card mbox" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="card-h"><h3 id="mt">Agendar reunião</h3><button type="button" class="btn ico" data-x aria-label="Fechar">${icon('x')}</button></div>

  <div class="f2"><div class="field"><label for="mdd">Data</label><input id="mdd" class="input" type="date" required min="${ymd(new Date())}" value="${MV.sel || ymd(new Date())}"></div><div class="field"><label for="mhh">Hora</label><input id="mhh" class="input" type="time" required value="10:00"></div></div>
  <div class="f2"><div class="field"><label for="mdu">Duração</label><select id="mdu" class="input">${[15, 30, 45, 60, 90].map(n => `<option value="${n}" ${n === 30 ? 'selected' : ''}>${n} min</option>`).join('')}</select></div><div class="field"><label for="mfm">Formato</label><select id="mfm" class="input"><option>Presencial</option><option>Videochamada</option></select></div></div>
  <div class="field"><label for="mlo">Local ou ligação</label><input id="mlo" class="input" placeholder="Sala, endereço ou ligação da chamada" maxlength="120"></div>
  <div class="field"><label>Participantes</label><div class="chips">${DEMO.team.map(m => `<label class="chip pick"><input class="sr" type="checkbox" value="${m[0]}">${m[0]}</label>`).join('')}</div></div>
  <p class="notice" style="margin:0 0 16px">Nesta fase a reunião fica só nesta pré-visualização. Não são enviados convites.</p>
  <div style="display:flex;gap:10px;justify-content:flex-end"><button type="button" class="btn" data-x>Cancelar</button><button class="btn pri">Agendar reunião</button></div></form>`;
  document.body.appendChild(d);
  const close = () => d.remove();
  d.querySelectorAll('[data-x]').forEach(b => b.onclick = close);
  d.onclick = e => { if (e.target === d) close(); };
  d.onkeydown = e => { if (e.key === 'Escape') close(); };
  d.querySelector('#mtt').focus();
  d.querySelector('form').onsubmit = e => {
    e.preventDefault();
    const g = i => d.querySelector('#' + i).value.trim(), day = g('mdd');
    MEET.push({ id: Date.now(), t: g('mtt'), d: day, h: g('mhh'), dur: +g('mdu'), fmt: g('mfm'), loc: g('mlo') || 'Local por definir', who: [...d.querySelectorAll('input[type=checkbox]:checked')].map(c => c.value) });
    const [y, m] = day.split('-'); MV.y = +y; MV.m = m - 1; MV.sel = day;
    close(); document.getElementById('meetBody').innerHTML = meetBody(); toast('Reunião agendada nesta pré-visualização.');
  };
}

function initMeet() {
  const b = document.getElementById('meetBody'); if (!b) return;
  document.getElementById('newMeet').onclick = openMeet;
  b.onclick = e => {
    const x = e.target.closest('[data-day],[data-mv],[data-del]'); if (!x) return;
    if (x.dataset.mv) { const d = new Date(MV.y, MV.m + +x.dataset.mv, 1); MV.y = d.getFullYear(); MV.m = d.getMonth(); }
    else if ('del' in x.dataset) { const i = MEET.findIndex(m => m.id == x.dataset.del); if (i > -1) MEET.splice(i, 1); toast('Reunião cancelada.'); }
    else MV.sel = (!x.dataset.day || x.dataset.day === MV.sel) ? null : x.dataset.day;
    b.innerHTML = meetBody();
  };
}

const hasFile = async u => { try { const r = await fetch(u, { method: 'HEAD' }); return r.ok && !/html/i.test(r.headers.get('content-type') || ''); } catch { return false; } };
const Book = b => { const m = bmGet(b.id); return Card('', `<div class="book"><div class="bcover"><span>${b.t}</span><small>${b.a}</small></div><div><span class="badge">${b.c}</span><h2 style="margin:10px 0 4px">${b.t}</h2><p class="muted sm">${b.a}</p><p style="margin-top:12px">${b.d}</p>
  ${m ? `<div style="margin-top:16px">${Progress(Math.round(m.page / m.total * 100))}<p class="muted sm" style="margin-top:6px">Marcador na página ${m.page} de ${m.total}</p></div>` : ''}

async function download(b) {

  const a = document.createElement('a'); a.href = b.file; a.download = b.file.split('/').pop(); document.body.appendChild(a); a.click(); a.remove();

async function openReader(b) {
  const r = document.createElement('div'); r.className = 'reader'; r.tabIndex = -1; r.setAttribute('role', 'dialog'); r.setAttribute('aria-label', 'Leitor: ' + b.t);
  r.innerHTML = `<div class="call-top"><b class="ell">${b.t}</b><span class="sp"></span><span class="muted sm" id="rbm"></span><button class="btn ico" id="rzo" aria-label="Diminuir">−</button><button class="btn ico" id="rzi" aria-label="Aumentar">+</button><button class="btn ico" id="rx" aria-label="Fechar leitor">${icon('x')}</button></div>
  <div class="rbody" id="rbody"><p class="muted">A carregar…</p></div>
  <div class="call-bar"><button class="btn" id="rprev">Anterior</button><span>Página <input id="rpg" class="input" type="number" min="1" aria-label="Número da página" style="width:76px;display:inline-block"> <span class="muted" id="rtot"></span></span><button class="btn" id="rnext">Seguinte</button><button class="btn" id="rrm" hidden>Remover marcador</button></div>`;
  document.body.appendChild(r); r.focus();
  const $ = s => r.querySelector(s), body = $('#rbody');
  let pdf = null, page = 1, total = 0, zoom = 1, task = null;
  const lab = () => { const m = bmGet(b.id); $('#rbm').textContent = m ? 'Marcador na página ' + m.page : 'Sem marcador'; $('#rrm').hidden = !m; };
  const draw = async () => {
    if (!pdf) return;
    const pg = await pdf.getPage(page), base = pg.getViewport({ scale: 1 }), w = Math.min(body.clientWidth - 32, 900) * zoom, vp = pg.getViewport({ scale: w / base.width }), dpr = window.devicePixelRatio || 1;
    const cv = document.createElement('canvas'); cv.width = vp.width * dpr; cv.height = vp.height * dpr; cv.style.width = vp.width + 'px'; cv.style.height = vp.height + 'px';
    if (task) task.cancel();
    task = pg.render({ canvasContext: cv.getContext('2d'), viewport: vp, transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null });
    try { await task.promise; body.replaceChildren(cv); body.scrollTop = 0; } catch {}
    $('#rpg').value = page;
  };
  const go = n => { if (!pdf) return; page = Math.min(Math.max(1, n | 0), total); bmSet(b.id, { page, total, ts: Date.now() }); lab(); draw(); };
  const start = async src => {
    body.innerHTML = '<p class="muted">A carregar…</p>';
    try { pdf = await pdfjsLib.getDocument(src).promise; } catch { return pickUI('Não foi possível abrir este ficheiro. Confirme que é um PDF.'); }
    total = pdf.numPages; $('#rtot').textContent = '/ ' + total; $('#rpg').max = total;
    const m = bmGet(b.id); page = m && m.page <= total ? m.page : 1;
    if (m && page > 1) toast('Retomado na página ' + page + '.');
    draw();
  };
  const pickUI = msg => {
    body.innerHTML = `<div class="card soon-card" style="max-width:520px;margin:40px auto;text-align:left"><h2>Ficheiro não encontrado</h2><p class="muted">${msg}</p><button class="btn pri" id="rpick">Abrir ficheiro do dispositivo</button></div>`;
    $('#rpick').onclick = () => { const i = document.createElement('input'); i.type = 'file'; i.accept = 'application/pdf'; i.onchange = async () => { const f = i.files[0]; if (f) start({ data: new Uint8Array(await f.arrayBuffer()) }); }; i.click(); };
  };
  const close = () => { if (task) task.cancel(); if (pdf) pdf.destroy(); r.remove(); const lb = document.getElementById('libBody'); if (lb) lb.innerHTML = BOOKS.map(Book).join(''); };
  $('#rx').onclick = close; $('#rprev').onclick = () => go(page - 1); $('#rnext').onclick = () => go(page + 1);
  $('#rpg').onchange = e => go(+e.target.value);
  $('#rzi').onclick = () => { zoom = Math.min(2.5, zoom + .25); draw(); }; $('#rzo').onclick = () => { zoom = Math.max(.5, zoom - .25); draw(); };
  $('#rrm').onclick = () => { bmSet(b.id, null); lab(); toast('Marcador removido.'); };
  r.onkeydown = e => { if (e.key === 'Escape') close(); else if (e.target.tagName !== 'INPUT') { if (e.key === 'ArrowRight') go(page + 1); if (e.key === 'ArrowLeft') go(page - 1); } };
  lab();
  try { await loadPdfjs(); } catch { body.innerHTML = '<p class="muted">Não foi possível carregar o leitor. Verifique a ligação à internet.</p>'; return; }
  if (await hasFile(b.file)) start({ url: b.file }); else pickUI('O ficheiro deste livro ainda não foi adicionado ao site. Pode abrir uma cópia guardada no seu dispositivo; o marcador funciona na mesma.');
}

async function startCall(mode, who) {
  let stream = null;
  try { if (!navigator.mediaDevices) throw 0; stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: mode === 'video' }); }
  catch { toast(mode === 'video' ? 'Sem acesso à câmara ou ao microfone. A chamada abre sem eles.' : 'Sem acesso ao microfone. A chamada abre sem ele.'); }
  const c = document.createElement('div'); c.className = 'call'; c.setAttribute('role', 'dialog'); c.setAttribute('aria-label', 'Chamada em grupo');
  const dis = stream ? '' : 'disabled';
  c.innerHTML = `<div class="call-top"><b>Operações</b><span class="muted sm" id="ctm">0:00</span><span class="sp"></span><span class="badge">Pré-visualização: sem ligação a outros membros</span></div>
  <div class="tiles"><div class="tile me">${mode === 'video' && stream ? '<video id="selfv" autoplay muted playsinline></video>' : Avatar(U.name, 'lg')}<b>Eu</b></div>${who.map(n => `<div class="tile">${Avatar(n, 'lg')}<b>${n}</b><span class="muted sm">Demonstração</span></div>`).join('')}</div>
  <div class="call-bar"><button class="btn ico" id="cmute" ${dis} aria-pressed="false" aria-label="Silenciar microfone">${icon('mic')}</button>${mode === 'video' ? `<button class="btn ico" id="ccam" ${dis} aria-pressed="false" aria-label="Desligar câmara">${icon('video')}</button>` : ''}<button class="btn pri" id="cend">Terminar chamada</button></div>`;
  document.body.appendChild(c);
  const sv = c.querySelector('#selfv'); if (sv) sv.srcObject = stream;
  const t0 = Date.now(), tm = c.querySelector('#ctm');
  const iv = setInterval(() => { const s = Math.round((Date.now() - t0) / 1000); tm.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }, 1000);
  const flip = (btn, tracks, on, off) => btn.onclick = () => {
    const dead = btn.getAttribute('aria-pressed') !== 'true'; tracks().forEach(t => t.enabled = !dead);
    btn.setAttribute('aria-pressed', dead); btn.classList.toggle('off', dead); btn.innerHTML = icon(dead ? off : on);
  };
  if (stream) {
    flip(c.querySelector('#cmute'), () => stream.getAudioTracks(), 'mic', 'micoff');
    const cam = c.querySelector('#ccam'); if (cam) flip(cam, () => stream.getVideoTracks(), 'video', 'vidoff');
  }
  const end = () => { clearInterval(iv); if (stream) stream.getTracks().forEach(t => t.stop()); c.remove(); toast('Chamada terminada.'); };
  c.querySelector('#cend').onclick = end; c.querySelector('#cend').focus();
  c.onkeydown = e => { if (e.key === 'Escape') end(); };
}

function initFiles() {

function initAudio() {
  const mic = document.getElementById('mic'); if (!mic) return;
  const bar = document.getElementById('rec'), inp = document.getElementById('cin'), cs = document.getElementById('csend'), th = document.getElementById('thread'), tm = document.getElementById('rtime');
  let mr, chunks = [], stream, t0, iv, cancel = false;
  const fmt = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  const aw = document.getElementById('attw'); const show = rec => { bar.hidden = !rec; inp.hidden = mic.hidden = cs.hidden = aw.hidden = rec; };
  mic.onclick = async () => {
    if (!navigator.mediaDevices || !window.MediaRecorder) return toast('Este navegador não suporta gravação de áudio.');
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch { return toast('Sem acesso ao microfone. Permita o acesso nas definições do navegador.'); }
    chunks = []; cancel = false; mr = new MediaRecorder(stream);
    mr.ondataavailable = e => e.data.size && chunks.push(e.data);
    mr.onstop = () => {
      const secs = Math.round((Date.now() - t0) / 1000);
      clearInterval(iv); stream.getTracks().forEach(t => t.stop()); show(false);
      if (cancel || !chunks.length) return;
      const url = URL.createObjectURL(new Blob(chunks, { type: mr.mimeType }));
      th.insertAdjacentHTML('beforeend', `<div class="msg me audio"><audio controls src="${url}"></audio><span class="sm">${fmt(secs)}</span></div>`);
      th.scrollTop = th.scrollHeight; toast('Áudio adicionado apenas a esta pré-visualização.');
    };
    mr.start(); t0 = Date.now(); tm.textContent = '0:00'; show(true);
    iv = setInterval(() => tm.textContent = fmt(Math.round((Date.now() - t0) / 1000)), 500);
  };
  document.getElementById('rcancel').onclick = () => { cancel = true; mr.stop(); };
  document.getElementById('rsend').onclick = () => mr.stop();
}

async function initChat() {

    th.scrollTop = th.scrollHeight;

    if (error) { i.value = body; return toast('Não foi possível enviar a mensagem.'); }
    add(m);
  };
  load();
}

    const a = e.target.closest('[data-act]'), d = e.target.closest('[data-delroom]');
    if (a) { const p = PROFILES.find(x => x.id === a.dataset.act); const { error } = await sb.from('profiles').update({ active: !p.active }).eq('id', p.id); toast(error ? 'Não foi possível alterar o estado.' : (p.active ? 'Utilizador desactivado.' : 'Utilizador activado.')); draw(); }
    if (d && confirm('Eliminar esta sala e todas as mensagens?')) { const { error } = await sb.from('rooms').delete().eq('id', d.dataset.delroom); toast(error ? 'Não foi possível eliminar.' : 'Sala eliminada.'); draw(); }
  };
  $q('#aroomf').onsubmit = async e => { e.preventDefault(); const n = $q('#aroom').value.trim(); if (!n) return; const { error } = await sb.from('rooms').insert({ name: n }); $q('#aroom').value = ''; toast(error ? 'Não foi possível criar a sala.' : 'Sala criada.'); draw(); };
  draw();
}

function render() {
  leaveChat();
  const route = (location.hash.replace('#', '') || 'dashboard');
  const root = document.getElementById('root');
  if (!authed() || route === 'login') {
    root.innerHTML = Login(); document.title = 'Entrar · Phoenix Empire';
    document.getElementById('lf').onsubmit = async e => {
      e.preventDefault();
      if (SB.on) {
        const { data, error } = await sb.auth.signInWithPassword({ email: document.getElementById('e').value.trim(), password: document.getElementById('p').value });
        if (error) return toast('E-mail ou palavra-passe incorrectos.');
        if (!(await enter(data.user))) return toast('Conta desactivada. Contacte um administrador.');
      } else { try { sessionStorage.setItem('th', '1'); } catch {} }
      location.hash = '#dashboard'; render();
    };
    return;
  }
  let r = V[route] ? route : 'dashboard'; if (r === 'admin' && SB.on && ME.role !== 'admin') r = 'dashboard';
  root.innerHTML = Shell(r); bind(r);
  document.title = NAV.find(n => n[0] === r)[1] + ' · Phoenix Empire'; scrollTo(0, 0);
}
addEventListener('hashchange', render); boot();

</script>
</body>
</html>
